# Policy for third-party crates, enforced by `cargo xtask deny`.

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]

[advisories]
ignore = [
    # Pulled in solely by the external reference formula engines (`ironcalc_base`
    # and `formualizer-eval`) inside the native-only `reticula-kernel-bench`
    # differential-testing harness; never compiled into the kernel, WASM module,
    # or server binary.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained `chrono` used transitively by `ironcalc_base` and `formualizer-eval` in `reticula-kernel-bench` only" },
    { id = "RUSTSEC-2026-0555", reason = "unmaintained `chrono-tz` used transitively by `ironcalc_base` in `reticula-kernel-bench` only" },
]

[licenses]
allow = ["Apache-2.0", "BSD-3-Clause", "CC0-1.0", "MIT", "Unicode-3.0"]
confidence-threshold = 0.93
exceptions = [
    # SQLx's hashlink dependency uses this hasher through hashbrown 0.16.
    { crate = "foldhash@=0.2.0", allow = ["Zlib"] },
    # Pure-Rust zlib backend pulled in by zip/deflate in `crates/xlsx`.
    { crate = "zlib-rs@=0.6.8", allow = ["Zlib"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
