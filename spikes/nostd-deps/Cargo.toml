[package]
name = "spike-nostd-deps"
description = "M0 check: the dependencies planned for the kernel build without the standard library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hashbrown = { version = "=0.17.1", default-features = false }
libm = { workspace = true }
lz4_flex = { version = "=0.14.2", default-features = false, features = ["alloc", "checked-decode", "safe-decode", "safe-encode"] }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
smallvec = { version = "=1.16.5", default-features = false, features = ["serde"] }
