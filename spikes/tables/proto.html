<!doctype html>
<meta charset="utf-8">
<title>Column store prototype</title>
<input type="file" id="file">
<script type="module">
const worker = new Worker("/proto-worker.mjs", { type: "module" });
const waiting = new Map();
let number = 0;
worker.onmessage = ({ data }) => { const [resolve, reject] = waiting.get(data.id); waiting.delete(data.id); data.error ? reject(new Error(data.error)) : resolve(data.value); };
worker.onerror = (e) => console.log("WORKER", e.message);
window.run = (name, argument) => new Promise((resolve, reject) => { waiting.set(++number, [resolve, reject]); worker.postMessage({ id: number, name, argument: name === "import" ? { ...argument, file: document.getElementById("file").files[0] } : argument }); });
</script>
