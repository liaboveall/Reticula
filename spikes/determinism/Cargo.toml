[package]
name = "spike-determinism"
description = "M0 checks: hash table iteration order, library generators, and the cost of libm rounding."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
hashbrown = { version = "=0.17.1", default-features = false }
libm = { workspace = true }
rand = { version = "=0.10.4", default-features = false }
reticula-core = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
