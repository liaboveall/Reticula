# The whole service: the server image, PostgreSQL 18 and the volume that
# holds workbook snapshots, with the memory and CPU limits of the target host.
#
# Settings and secrets come from an env file that stays out of the repository
# (`docker compose --env-file <file> up -d`):
#
#   POSTGRES_PASSWORD               database password
#   RETICULA_PUBLIC_ORIGIN          origin browsers use, e.g. https://example.com
#   RETICULA_GITHUB_CLIENT_ID       GitHub OAuth application
#   RETICULA_GITHUB_CLIENT_SECRET
#   RETICULA_IMAGE                  optional, defaults to the published image
#   PORT                            optional loopback port, defaults to 3200
#   METRICS_PORT                    optional loopback metrics port, defaults to 3201
#   RETICULA_LLM_*                  optional AI analyst provider settings (see .env.example)
#   RETICULA_AGENT_*                optional AI analyst quotas & run guardrails (see .env.example)
#   RETICULA_MAX_CONCURRENT_AGENT_RUNS
#                                   optional global AI analyst concurrency limit (default 2)
#
# `cargo xtask stack` runs this file against a locally built image.
name: reticula

services:
  postgres:
    image: postgres:18.7-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: reticula
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      POSTGRES_DB: reticula
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30"]
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reticula -d reticula"]
      interval: 2s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 0.5
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  server:
    image: ${RETICULA_IMAGE:-ghcr.io/liaboveall/reticula:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-3200}:3200"
      - "127.0.0.1:${METRICS_PORT:-3201}:3201"
    environment:
      BIND_ADDR: "0.0.0.0:3200"
      RETICULA_METRICS_ADDR: "0.0.0.0:3201"
      RETICULA_STATIC_DIR: "/srv/reticula/dist"
      RETICULA_DATA_DIR: "/var/lib/reticula"
      RETICULA_DATABASE_URL: "postgres://reticula:${POSTGRES_PASSWORD}@postgres:5432/reticula"
      RETICULA_PUBLIC_ORIGIN: ${RETICULA_PUBLIC_ORIGIN:?set RETICULA_PUBLIC_ORIGIN in the env file}
      RETICULA_AUTH_MODE: "github"
      RETICULA_GITHUB_CLIENT_ID: ${RETICULA_GITHUB_CLIENT_ID:?set RETICULA_GITHUB_CLIENT_ID in the env file}
      RETICULA_GITHUB_CLIENT_SECRET: ${RETICULA_GITHUB_CLIENT_SECRET:?set RETICULA_GITHUB_CLIENT_SECRET in the env file}
      RETICULA_LLM_ENABLED: ${RETICULA_LLM_ENABLED:-false}
      RETICULA_LLM_MODE: ${RETICULA_LLM_MODE:-}
      RETICULA_LLM_PROVIDER: ${RETICULA_LLM_PROVIDER:-}
      RETICULA_LLM_BASE_URL: ${RETICULA_LLM_BASE_URL:-}
      RETICULA_LLM_MODEL: ${RETICULA_LLM_MODEL:-}
      RETICULA_LLM_API_KEY: ${RETICULA_LLM_API_KEY:-}
      RETICULA_LLM_REASONING_EFFORT: ${RETICULA_LLM_REASONING_EFFORT:-}
      RETICULA_LLM_TIMEOUT_SECS: ${RETICULA_LLM_TIMEOUT_SECS:-}
      RETICULA_AGENT_DAILY_TOKEN_LIMIT: ${RETICULA_AGENT_DAILY_TOKEN_LIMIT:-}
      RETICULA_AGENT_DAILY_RUN_LIMIT: ${RETICULA_AGENT_DAILY_RUN_LIMIT:-}
      RETICULA_MAX_CONCURRENT_AGENT_RUNS: ${RETICULA_MAX_CONCURRENT_AGENT_RUNS:-}
      RETICULA_AGENT_MAX_STEPS: ${RETICULA_AGENT_MAX_STEPS:-}
      RETICULA_AGENT_MAX_TOKENS_PER_RUN: ${RETICULA_AGENT_MAX_TOKENS_PER_RUN:-}
      RETICULA_AGENT_TIMEOUT_SECS: ${RETICULA_AGENT_TIMEOUT_SECS:-}
    volumes:
      - workbooks:/var/lib/reticula
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.0
    logging: *logging

volumes:
  pgdata:
  workbooks:
