services:
  server:
    image: ${RETICULA_IMAGE:-ghcr.io/liaboveall/reticula:latest}
    container_name: reticula-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3200}:3200"
    environment:
      BIND_ADDR: "0.0.0.0:3200"
      RETICULA_STATIC_DIR: "/srv/reticula/dist"
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
