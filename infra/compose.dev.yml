# Development database for the collaborative server, its integration tests
# and the end-to-end tests: `cargo xtask db up`.
#
# It listens on 127.0.0.1:5434 only and holds throwaway data, so its password
# is a fixed development value rather than a secret.
name: reticula-dev

services:
  postgres:
    image: postgres:18.7-bookworm
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: reticula
      POSTGRES_PASSWORD: reticula_local_dev
      POSTGRES_DB: reticula
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=100"]
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reticula -d reticula"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 768m
    cpus: 0.5

volumes:
  pgdata:
