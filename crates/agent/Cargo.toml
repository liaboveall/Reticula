[package]
name = "reticula-agent"
description = "Shared AI analyst agent runtime, three-way branch diff/merge planner, replay bundler, and headless benchmark harness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
futures-util = "0.3.34"
postcard.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls-no-alpn"] }
reticula-core.workspace = true
reticula-formula.workspace = true
reticula-sync.workspace = true
reticula-wire.workspace = true
reticula-xlsx.workspace = true
serde.workspace = true
serde_json = "1.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
utoipa = { version = "6.0.0", features = ["uuid"] }
