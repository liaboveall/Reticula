[package]
name = "reticula-server"
description = "HTTP and WebSocket server for Reticula collaboration and static assets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.12.6", default-features = false, features = ["cookie"] }
base64 = "0.23.1"
hmac = "0.13.0"
lz4_flex.workspace = true
oauth2 = { version = "5.0.0", default-features = false }
postcard.workspace = true
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls-no-alpn", "query"] }
reticula-core.workspace = true
reticula-formula.workspace = true
reticula-sync.workspace = true
reticula-wire.workspace = true
serde.workspace = true
sha2 = { version = "0.11.1", default-features = false }
sqlx = { version = "0.9.1", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "uuid"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3", default-features = false }
tokio = { version = "1.54.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.7.1", features = ["fs"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
utoipa = { version = "6.0.0", features = ["uuid"] }
uuid = { version = "1.29.3", features = ["serde", "v4"] }

[dev-dependencies]
futures-util = "0.3.34"
serde_json = "1.0"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.30.0"
