[package]
name = "reticula-xlsx"
description = "XLSX import, export, and streaming original-workbook patching backed by calamine, rust_xlsxwriter, zip, and quick-xml."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
calamine = { version = "0.38.0", default-features = false }
quick-xml = "0.42.0"
reticula-core = { workspace = true }
reticula-formula = { workspace = true }
reticula-wire = { workspace = true }
rust_xlsxwriter = "0.103.0"
serde = { workspace = true, features = ["std"] }
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rust_xlsxwriter = { version = "0.103.0", features = ["wasm"] }
