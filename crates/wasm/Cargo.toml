[package]
name = "reticula-wasm"
description = "WebAssembly bindings: the entry point of the Reticula engine worker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
bench = []

[dependencies]
reticula-core = { workspace = true }
reticula-formula = { workspace = true }
reticula-sync = { workspace = true }
reticula-wire = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_bytes = "0.11"
tsify = { workspace = true }
uuid = { version = "1.29.3", default-features = false }
wasm-bindgen = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
