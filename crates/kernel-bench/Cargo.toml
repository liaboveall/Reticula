[package]
name = "reticula-kernel-bench"
description = "Native property tests, differential testing against reference engines, fuzz harnesses and micro-benchmarks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bench]]
name = "kernel"
harness = false

[dependencies]
arbitrary = { version = "1.5.0", features = ["derive"] }
formualizer-common = "4.2.0"
formualizer-eval = { version = "0.14.0", features = ["test-support"] }
formualizer-parse = "4.2.0"
ironcalc_base = "0.9.1"
reticula-core = { workspace = true }
reticula-formula = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = "1.0"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.12.0"
