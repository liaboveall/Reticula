[package]
name = "reticula-kernel-bench"
description = "Native property tests, differential testing against reference engines, fuzz harnesses and micro-benchmarks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["diff"]
diff = [
  "dep:formualizer-common",
  "dep:formualizer-eval",
  "dep:formualizer-parse",
  "dep:ironcalc_base",
  "dep:reticula-xlsx",
  "dep:serde_json",
]

[[bin]]
name = "runner"
path = "src/bin/runner.rs"
required-features = ["diff"]

[[test]]
name = "diff_regression"
path = "tests/diff_regression.rs"
required-features = ["diff"]

[[bench]]
name = "kernel"
harness = false

[dependencies]
arbitrary = { version = "1.5.0", features = ["derive"] }
formualizer-common = { version = "4.2.0", optional = true }
formualizer-eval = { version = "0.14.0", features = ["test-support"], optional = true }
formualizer-parse = { version = "4.2.0", optional = true }
ironcalc_base = { version = "0.9.1", optional = true }
postcard = { workspace = true }
reticula-core = { workspace = true }
reticula-formula = { workspace = true }
reticula-sync = { workspace = true }
reticula-wasm = { path = "../wasm", features = ["bench"] }
reticula-wire = { workspace = true }
reticula-xlsx = { workspace = true, optional = true }
serde = { workspace = true, features = ["std"] }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.12.0"
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
