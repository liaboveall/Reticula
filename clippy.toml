# Tests may panic; kernel code may not (see the kernel lint block in each kernel crate).
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-unwrap-in-tests = true

# Platform-dependent floating point. The standard library does not specify the
# precision of these methods, and `mul_add` changes rounding. Engine results must
# be bit-identical on every target, so all of them go through `reticula_core::num`.
disallowed-methods = [
    { path = "f64::sin", reason = "use reticula_core::num" },
    { path = "f64::cos", reason = "use reticula_core::num" },
    { path = "f64::tan", reason = "use reticula_core::num" },
    { path = "f64::sin_cos", reason = "use reticula_core::num" },
    { path = "f64::asin", reason = "use reticula_core::num" },
    { path = "f64::acos", reason = "use reticula_core::num" },
    { path = "f64::atan", reason = "use reticula_core::num" },
    { path = "f64::atan2", reason = "use reticula_core::num" },
    { path = "f64::sinh", reason = "use reticula_core::num" },
    { path = "f64::cosh", reason = "use reticula_core::num" },
    { path = "f64::tanh", reason = "use reticula_core::num" },
    { path = "f64::asinh", reason = "use reticula_core::num" },
    { path = "f64::acosh", reason = "use reticula_core::num" },
    { path = "f64::atanh", reason = "use reticula_core::num" },
    { path = "f64::exp", reason = "use reticula_core::num" },
    { path = "f64::exp2", reason = "use reticula_core::num" },
    { path = "f64::exp_m1", reason = "use reticula_core::num" },
    { path = "f64::ln", reason = "use reticula_core::num" },
    { path = "f64::ln_1p", reason = "use reticula_core::num" },
    { path = "f64::log", reason = "use reticula_core::num" },
    { path = "f64::log2", reason = "use reticula_core::num" },
    { path = "f64::log10", reason = "use reticula_core::num" },
    { path = "f64::powf", reason = "use reticula_core::num" },
    { path = "f64::powi", reason = "use reticula_core::num" },
    { path = "f64::cbrt", reason = "use reticula_core::num" },
    { path = "f64::hypot", reason = "use reticula_core::num" },
    { path = "f64::mul_add", reason = "fused multiply-add changes rounding" },
    { path = "f32::sin", reason = "the engine computes in f64 through reticula_core::num" },
    { path = "f32::cos", reason = "the engine computes in f64 through reticula_core::num" },
    { path = "f32::tan", reason = "the engine computes in f64 through reticula_core::num" },
    { path = "f32::exp", reason = "the engine computes in f64 through reticula_core::num" },
    { path = "f32::ln", reason = "the engine computes in f64 through reticula_core::num" },
    { path = "f32::powf", reason = "the engine computes in f64 through reticula_core::num" },
    { path = "f32::powi", reason = "the engine computes in f64 through reticula_core::num" },
    { path = "f32::mul_add", reason = "fused multiply-add changes rounding" },
]
