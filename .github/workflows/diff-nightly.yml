name: LibreOffice Diff Nightly

# 50,000+ stratified deterministic formula evaluation comparing Reticula
# against headless LibreOffice Calc (and IronCalc + Formualizer reference
# engines). Uploads target/qa/libreoffice-diff-report.json.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      quota_per_fn:
        description: "Stratified samples per deterministic catalog function"
        required: false
        default: "250"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  diff-libreoffice:
    name: libreoffice diff (${{ inputs.quota_per_fn || '250' }} per fn)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: docker build -t reticula-libreoffice:26.8.2 infra/libreoffice
      - run: cargo xtask diff --engine all --skip-image --quota-per-fn "${{ inputs.quota_per_fn || '250' }}" --out target/qa/libreoffice-diff-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: libreoffice-diff-report
          path: target/qa/libreoffice-diff-report.json
