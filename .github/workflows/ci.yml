name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

# Runner images are named by version so that moving to a new image is a visible
# change. Third-party actions are pinned to a commit. Every job runs the same
# `cargo xtask` commands a developer runs locally.
jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The three native targets the engine must agree on: the determinism
        # digest is part of the test suite.
        os: [windows-2025, ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.152
      - run: cargo xtask check --rust
      - run: cargo xtask test --rust

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@0.20.2
      - run: cargo xtask deny

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: wasm-bindgen@0.2.130
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install pnpm
        run: npm install --global "$(node --print "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - run: cargo xtask test --wasm
      - run: cargo xtask wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-pkg
          path: packages/protocol/pkg
          if-no-files-found: error

  web:
    needs: wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install pnpm
        run: npm install --global "$(node --print "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-pkg
          path: packages/protocol/pkg
      - run: cargo xtask check --web --skip-wasm
      - run: cargo xtask test --web
      - run: cargo xtask build --skip-wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          # Both directories, kept apart: the artifact's root is apps/web.
          path: |
            apps/web/dist
            apps/web/dist-spikes
          if-no-files-found: error

  e2e:
    name: e2e (${{ matrix.browser }})
    needs: web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, browser: chromium }
          - { os: ubuntu-24.04, browser: firefox }
          # WebKit runs on macOS, the platform whose behaviour it stands in for.
          - { os: macos-26, browser: webkit }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install pnpm
        run: npm install --global "$(node --print "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: cargo xtask e2e --skip-build --browser ${{ matrix.browser }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-results-${{ matrix.browser }}
          path: test-results
