name: Sim Nightly

# 100,000 seeds of the deterministic sync simulation, every fault and every
# invariant (`cargo xtask sim`). CI runs 5,000 on each push.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: "Number of seeds"
        required: false
        default: "100000"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  sim:
    name: sim (${{ inputs.seeds || '100000' }} seeds)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo xtask sim --seeds "${{ inputs.seeds || '100000' }}" --out target/sim-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sim-report
          path: target/sim-report.json
