name: Safari Smoke

# Runs production `/app` smoke verification in real Safari via macOS `safaridriver`
# (OPFS SyncAccessHandle snapshot/WAL persistence, dual-tab Web Lock & hung-worker
# takeover, formula recalculation, and determinism digest check).
# Scheduled nightly (offset from Fuzz) and triggerable manually.
on:
  schedule:
    - cron: "29 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safari-smoke-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build production web dist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: wasm-bindgen@0.2.130
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install pnpm
        run: npm install --global "$(node --print "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - run: cargo xtask build --check-budget
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: safari-web-dist
          path: apps/web/dist
          if-no-files-found: error

  safari:
    name: real Safari smoke (macos-26)
    needs: build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: safari-web-dist
          path: apps/web/dist
      - name: Enable Safari WebDriver automation
        run: sudo safaridriver --enable
      - name: Run production Safari smoke suite
        run: node tests/e2e/safari-smoke.mjs --dist apps/web/dist --out target/safari-smoke/report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: safari-smoke-report
          path: target/safari-smoke/report.json
